name: TODO app CI

on:
  push:
    branches:
      - main
      - feat/todo-backend
  pull_request:
    branches:
      - main
      - feat/todo-backend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: todo_app_backend/package-lock.json

      - name: Install dependencies
        working-directory: todo_app_backend
        run: npm ci

      - name: Run tests
        working-directory: todo_app_backend
        run: npm test -- --runInBand
